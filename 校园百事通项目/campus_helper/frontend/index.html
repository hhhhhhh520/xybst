<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校园百事通 - AI智能服务</title>
    <!-- 使用国内CDN加速字体加载 -->
    <link rel="preconnect" href="https://fonts.loli.net">
    <link rel="preconnect" href="https://gstatic.loli.net" crossorigin>
    <link href="https://fonts.loli.net/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Light Theme */
            --bg-primary: #f0f4f8;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8eef4;
            --text-primary: #1a2b3c;
            --text-secondary: #5a6b7c;
            --text-muted: #8a9bac;
            --accent-primary: #0ea5e9;
            --accent-secondary: #06b6d4;
            --accent-gradient: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 50%, #10b981 100%);
            --border-color: rgba(0, 0, 0, 0.08);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.12);
            --glass-bg: rgba(255, 255, 255, 0.72);
            --glass-border: rgba(255, 255, 255, 0.5);
            --message-user-bg: linear-gradient(135deg, #0ea5e9 0%, #06b6d4 100%);
            --message-assistant-bg: #ffffff;
            --sidebar-bg: rgba(248, 250, 252, 0.95);
            --input-bg: #ffffff;
            --hover-bg: rgba(14, 165, 233, 0.08);
            --success-color: #10b981;
            --error-color: #ef4444;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --text-muted: #64748b;
            --accent-primary: #38bdf8;
            --accent-secondary: #22d3ee;
            --accent-gradient: linear-gradient(135deg, #38bdf8 0%, #22d3ee 50%, #34d399 100%);
            --border-color: rgba(255, 255, 255, 0.1);
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 16px 48px rgba(0, 0, 0, 0.4);
            --glass-bg: rgba(30, 41, 59, 0.8);
            --glass-border: rgba(255, 255, 255, 0.1);
            --message-user-bg: linear-gradient(135deg, #0284c7 0%, #0891b2 100%);
            --message-assistant-bg: #1e293b;
            --sidebar-bg: rgba(15, 23, 42, 0.95);
            --input-bg: #1e293b;
            --hover-bg: rgba(56, 189, 248, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Noto Sans SC', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* Animated Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
            overflow: hidden;
            pointer-events: none;
        }

        .bg-blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: float 20s ease-in-out infinite;
        }

        .bg-blob:nth-child(1) {
            width: 600px;
            height: 600px;
            background: linear-gradient(135deg, #0ea5e9, #06b6d4);
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .bg-blob:nth-child(2) {
            width: 500px;
            height: 500px;
            background: linear-gradient(135deg, #10b981, #06b6d4);
            bottom: -150px;
            left: -100px;
            animation-delay: -7s;
        }

        .bg-blob:nth-child(3) {
            width: 400px;
            height: 400px;
            background: linear-gradient(135deg, #8b5cf6, #0ea5e9);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            25% { transform: translate(30px, -30px) scale(1.05); }
            50% { transform: translate(-20px, 20px) scale(0.95); }
            75% { transform: translate(20px, 30px) scale(1.02); }
        }

        /* Main Layout */
        .app-container {
            display: flex;
            height: 100vh;
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 280px;
            background: var(--sidebar-bg);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease, width 0.3s ease;
        }

        .sidebar.collapsed {
            transform: translateX(-100%);
            width: 0;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .new-chat-btn {
            width: 100%;
            padding: 14px 20px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .new-chat-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(14, 165, 233, 0.3);
        }

        .chat-history {
            flex: 1;
            overflow-y: auto;
            padding: 12px;
        }

        .chat-history-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 12px 8px 8px;
        }

        .history-item {
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: background 0.2s;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .history-item:hover {
            background: var(--hover-bg);
        }

        .history-item.active {
            background: var(--hover-bg);
        }

        .history-item-icon {
            width: 32px;
            height: 32px;
            background: var(--bg-tertiary);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
        }

        .history-item-content {
            flex: 1;
            min-width: 0;
        }

        .history-item-title {
            font-size: 13px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .history-item-time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .history-item-delete {
            opacity: 0;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            border-radius: 4px;
            transition: opacity 0.2s, color 0.2s;
        }

        .history-item:hover .history-item-delete {
            opacity: 1;
        }

        .history-item-delete:hover {
            color: var(--error-color);
        }

        /* Main Chat Area */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Header */
        .chat-header {
            padding: 16px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .menu-toggle {
            display: none;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            padding: 8px;
            border-radius: 8px;
            transition: background 0.2s;
        }

        .menu-toggle:hover {
            background: var(--hover-bg);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.3);
        }

        .logo-text h1 {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .logo-text p {
            font-size: 12px;
            color: var(--text-muted);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .header-btn {
            background: var(--bg-tertiary);
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 10px;
            border-radius: 10px;
            transition: background 0.2s, color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            background: var(--bg-tertiary);
            border-radius: 20px;
            font-size: 12px;
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--text-muted);
            animation: pulse 2s ease-in-out infinite;
        }

        .status-dot.connected {
            background: var(--success-color);
        }

        .status-dot.error {
            background: var(--error-color);
            animation: none;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Chat Messages */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        .welcome-screen {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            padding: 40px;
            animation: fadeInUp 0.6s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .welcome-icon {
            width: 80px;
            height: 80px;
            background: var(--accent-gradient);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
            box-shadow: 0 8px 32px rgba(14, 165, 233, 0.3);
        }

        .welcome-title {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            max-width: 400px;
            line-height: 1.6;
            margin-bottom: 40px;
        }

        .quick-actions {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            max-width: 500px;
            width: 100%;
        }

        .quick-action {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
        }

        .quick-action:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
            border-color: var(--accent-primary);
        }

        .quick-action-icon {
            width: 40px;
            height: 40px;
            background: var(--hover-bg);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-bottom: 12px;
        }

        .quick-action-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .quick-action-desc {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* Messages */
        .message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
            animation: messageIn 0.4s ease;
        }

        @keyframes messageIn {
            from {
                opacity: 0;
                transform: translateY(16px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message.assistant .message-avatar {
            background: var(--accent-gradient);
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        .message.user .message-avatar {
            background: var(--bg-tertiary);
        }

        .message-body {
            max-width: 70%;
            min-width: 100px;
        }

        .message-content {
            padding: 16px 20px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.7;
            position: relative;
        }

        .message.assistant .message-content {
            background: var(--message-assistant-bg);
            border: 1px solid var(--border-color);
            border-top-left-radius: 4px;
            box-shadow: var(--shadow-sm);
        }

        .message.user .message-content {
            background: var(--message-user-bg);
            color: white;
            border-top-right-radius: 4px;
        }

        .message-content p {
            margin-bottom: 12px;
        }

        .message-content p:last-child {
            margin-bottom: 0;
        }

        .message-content strong {
            font-weight: 600;
            color: var(--accent-primary);
        }

        .message.user .message-content strong {
            color: rgba(255, 255, 255, 0.9);
        }

        .message-content ul, .message-content ol {
            margin: 12px 0;
            padding-left: 24px;
        }

        .message-content li {
            margin: 6px 0;
        }

        .message-sources {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .message-actions {
            display: flex;
            gap: 4px;
            margin-top: 8px;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .message:hover .message-actions {
            opacity: 1;
        }

        .message-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 12px;
            display: flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s, color 0.2s;
        }

        .message-action-btn:hover {
            background: var(--hover-bg);
            color: var(--accent-primary);
        }

        /* Loading Animation */
        .loading-message {
            display: flex;
            gap: 16px;
            margin-bottom: 24px;
        }

        .loading-content {
            background: var(--message-assistant-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            border-top-left-radius: 4px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .typing-indicator {
            display: flex;
            gap: 4px;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent-primary);
            border-radius: 50%;
            animation: typing 1.4s ease-in-out infinite;
        }

        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes typing {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .loading-text {
            font-size: 14px;
            color: var(--text-muted);
        }

        /* Input Area */
        .chat-input-area {
            padding: 20px 24px;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border-color);
        }

        .input-container {
            display: flex;
            gap: 12px;
            align-items: flex-end;
            background: var(--input-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            padding: 8px 8px 8px 20px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-container:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .chat-input {
            flex: 1;
            border: none;
            background: transparent;
            font-size: 14px;
            color: var(--text-primary);
            resize: none;
            min-height: 24px;
            max-height: 120px;
            line-height: 1.5;
            font-family: inherit;
        }

        .chat-input::placeholder {
            color: var(--text-muted);
        }

        .chat-input:focus {
            outline: none;
        }

        .send-btn {
            width: 44px;
            height: 44px;
            background: var(--accent-gradient);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 16px rgba(14, 165, 233, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quick-replies {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            flex-wrap: wrap;
        }

        .quick-reply {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
        }

        .quick-reply:hover {
            background: var(--hover-bg);
            border-color: var(--accent-primary);
            color: var(--accent-primary);
        }

        /* Toast Notifications */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 12px 20px;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 10px;
            animation: toastIn 0.3s ease;
        }

        @keyframes toastIn {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .toast.success { border-left: 4px solid var(--success-color); }
        .toast.error { border-left: 4px solid var(--error-color); }

        /* Responsive */
        @media (max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                height: 100%;
                z-index: 100;
                box-shadow: var(--shadow-lg);
            }

            .sidebar.collapsed {
                transform: translateX(-100%);
            }

            .menu-toggle {
                display: flex;
            }

            .quick-actions {
                grid-template-columns: 1fr;
            }

            .message-body {
                max-width: 85%;
            }

            .status-indicator span:last-child {
                display: none;
            }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        /* Streaming Cursor Animation */
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }

        .streaming-cursor {
            color: var(--accent-primary);
            font-weight: bold;
            animation: blink 1s infinite;
        }

        .stop-btn {
            background: var(--error-color);
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            padding: 8px 16px;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            margin-top: 8px;
        }

        .stop-btn:hover {
            background: #dc2626;
            transform: scale(1.02);
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
        <div class="bg-blob"></div>
    </div>

    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <button class="new-chat-btn" onclick="startNewChat()">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                    新建对话
                </button>
            </div>
            <div class="chat-history" id="chatHistory">
                <div class="chat-history-title">历史记录</div>
                <!-- History items will be added here -->
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="chat-header">
                <div class="header-left">
                    <button class="menu-toggle" onclick="toggleSidebar()">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="3" y1="12" x2="21" y2="12"></line>
                            <line x1="3" y1="6" x2="21" y2="6"></line>
                            <line x1="3" y1="18" x2="21" y2="18"></line>
                        </svg>
                    </button>
                    <div class="logo">
                        <div class="logo-icon">🎓</div>
                        <div class="logo-text">
                            <h1>校园百事通</h1>
                            <p>AI智能服务助手</p>
                        </div>
                    </div>
                </div>
                <div class="header-actions">
                    <div class="status-indicator">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">检测中</span>
                    </div>
                    <button class="header-btn" onclick="toggleTheme()" title="切换主题">
                        <svg id="themeIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                </div>
            </header>

            <!-- Chat Messages -->
            <div class="chat-messages" id="chatMessages">
                <div class="welcome-screen" id="welcomeScreen">
                    <div class="welcome-icon">🎓</div>
                    <h2 class="welcome-title">你好，我是小百</h2>
                    <p class="welcome-subtitle">你的校园AI助手，可以帮你解答教务、学工、后勤等各类校园问题</p>
                    <div class="quick-actions">
                        <div class="quick-action" onclick="quickSend('图书馆开放时间是什么？')">
                            <div class="quick-action-icon">📚</div>
                            <div class="quick-action-title">图书馆时间</div>
                            <div class="quick-action-desc">查询图书馆开放时间</div>
                        </div>
                        <div class="quick-action" onclick="quickSend('奖学金怎么申请？')">
                            <div class="quick-action-icon">🏆</div>
                            <div class="quick-action-title">奖学金申请</div>
                            <div class="quick-action-desc">了解奖学金申请流程</div>
                        </div>
                        <div class="quick-action" onclick="quickSend('在读证明怎么办理？')">
                            <div class="quick-action-icon">📋</div>
                            <div class="quick-action-title">在读证明</div>
                            <div class="quick-action-desc">办理在读证明流程</div>
                        </div>
                        <div class="quick-action" onclick="quickSend('选课流程是什么？')">
                            <div class="quick-action-icon">📅</div>
                            <div class="quick-action-title">选课流程</div>
                            <div class="quick-action-desc">了解选课操作流程</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="chat-input-area">
                <div class="input-container">
                    <textarea
                        class="chat-input"
                        id="chatInput"
                        placeholder="输入你想了解的问题..."
                        rows="1"
                    ></textarea>
                    <button class="send-btn" id="sendBtn" onclick="sendMessage()">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="22" y1="2" x2="11" y2="13"></line>
                            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                        </svg>
                    </button>
                </div>
                <div class="quick-replies">
                    <button class="quick-reply" onclick="quickSend('图书馆开放时间')">图书馆时间</button>
                    <button class="quick-reply" onclick="quickSend('奖学金怎么申请')">奖学金申请</button>
                    <button class="quick-reply" onclick="quickSend('在读证明怎么办理')">在读证明</button>
                    <button class="quick-reply" onclick="quickSend('选课流程是什么')">选课流程</button>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script>
        // Configuration
        const API_BASE = '/api';
        let sessionId = 'session_' + Date.now();
        let userId = 'user_' + Math.random().toString(36).substr(2, 9);
        let chatHistory = [];
        let currentChatId = null;
        let abortController = null; // For canceling streaming requests

        // DOM Elements
        const chatMessages = document.getElementById('chatMessages');
        const chatInput = document.getElementById('chatInput');
        const sendBtn = document.getElementById('sendBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const sidebar = document.getElementById('sidebar');
        const chatHistoryEl = document.getElementById('chatHistory');

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            loadTheme();
            loadChatHistory();
            checkHealth();
            setupInputAutoResize();
        });

        // Theme Management
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            document.documentElement.setAttribute('data-theme', savedTheme);
            updateThemeIcon(savedTheme);
        }

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            updateThemeIcon(newTheme);
        }

        function updateThemeIcon(theme) {
            const icon = document.getElementById('themeIcon');
            if (theme === 'dark') {
                icon.innerHTML = `
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                `;
            } else {
                icon.innerHTML = `
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                `;
            }
        }

        // Sidebar Toggle
        function toggleSidebar() {
            sidebar.classList.toggle('collapsed');
        }

        // Health Check
        async function checkHealth() {
            try {
                const res = await fetch('/health');
                const data = await res.json();
                statusDot.classList.add('connected');
                statusDot.classList.remove('error');
                statusText.textContent = '服务正常';
            } catch (e) {
                statusDot.classList.add('error');
                statusDot.classList.remove('connected');
                statusText.textContent = '连接失败';
            }
        }

        // Input Auto Resize
        function setupInputAutoResize() {
            chatInput.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = Math.min(this.scrollHeight, 120) + 'px';
            });

            chatInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
        }

        // Quick Send
        function quickSend(text) {
            chatInput.value = text;
            sendMessage();
        }

        // Send Message with SSE Streaming
        async function sendMessage() {
            const message = chatInput.value.trim();
            if (!message) return;

            // Hide welcome screen
            if (welcomeScreen) {
                welcomeScreen.style.display = 'none';
            }

            // Add user message
            addMessage(message, 'user');
            chatInput.value = '';
            chatInput.style.height = 'auto';
            sendBtn.disabled = true;

            // Create abort controller for this request
            abortController = new AbortController();

            // Create streaming message container
            const streamingMsgDiv = createStreamingMessage();

            try {
                const response = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: message,
                        session_id: sessionId,
                        user_id: userId
                    }),
                    signal: abortController.signal
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                // Read the stream
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let accumulatedContent = '';
                let sources = null;
                let cached = false;

                while (true) {
                    const { done, value } = await reader.read();

                    if (done) break;

                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split('\n');

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.slice(6));

                                if (data.type === 'chunk') {
                                    accumulatedContent += data.content;
                                    updateStreamingMessage(streamingMsgDiv, accumulatedContent);
                                } else if (data.type === 'done') {
                                    sources = data.sources;
                                    cached = data.cached;
                                    // Stream complete
                                    break;
                                } else if (data.type === 'error') {
                                    throw new Error(data.message || '生成失败');
                                }
                            } catch (e) {
                                // Skip invalid JSON lines
                                if (e instanceof SyntaxError) continue;
                                throw e;
                            }
                        }
                    }
                }

                // Finalize the message
                finalizeMessage(streamingMsgDiv, accumulatedContent, sources, cached);

                // Save to history
                saveChatToHistory(message, accumulatedContent);

            } catch (error) {
                if (error.name === 'AbortError') {
                    // User cancelled
                    showToast('已停止生成', 'success');
                    streamingMsgDiv.remove();
                } else {
                    finalizeMessage(streamingMsgDiv, '抱歉，服务暂时不可用，请确认后端服务已启动', null, false);
                    showToast('服务连接失败', 'error');
                    console.error('Error:', error);
                }
            }

            abortController = null;
            sendBtn.disabled = false;
        }

        // Create streaming message container
        function createStreamingMessage() {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message assistant';
            messageDiv.id = 'streaming-message';

            messageDiv.innerHTML = `
                <div class="message-avatar">🎓</div>
                <div class="message-body">
                    <div class="message-content">
                        <span class="streaming-content"></span><span class="streaming-cursor">|</span>
                    </div>
                    <button class="stop-btn" onclick="stopGeneration()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="6" y="6" width="12" height="12" rx="2"></rect>
                        </svg>
                        停止生成
                    </button>
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return messageDiv;
        }

        // Update streaming message content
        function updateStreamingMessage(messageDiv, content) {
            const contentSpan = messageDiv.querySelector('.streaming-content');
            if (contentSpan) {
                contentSpan.innerHTML = formatContent(content);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }
        }

        // Finalize message rendering
        function finalizeMessage(messageDiv, content, sources, cached) {
            // Remove the streaming message if it exists
            const existingMsg = document.getElementById('streaming-message');
            if (existingMsg) existingMsg.remove();

            // Add the final message
            addMessage(content, 'assistant', sources, cached);
        }

        // Stop generation
        function stopGeneration() {
            if (abortController) {
                abortController.abort();
            }
        }

        // Add Message
        function addMessage(content, role, sources = null, cached = false) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const avatar = role === 'assistant'
                ? '<div class="message-avatar">🎓</div>'
                : '<div class="message-avatar">👤</div>';

            let sourcesHtml = '';
            if (sources && sources.length > 0) {
                sourcesHtml = `
                    <div class="message-sources">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                        </svg>
                        来源: ${sources.map(s => escapeHtml(s.title)).join(', ')}
                        ${cached ? '<span style="margin-left: 8px; color: var(--success-color);">(缓存)</span>' : ''}
                    </div>
                `;
            } else if (cached) {
                sourcesHtml = `
                    <div class="message-sources">
                        <span style="color: var(--success-color);">来自缓存</span>
                    </div>
                `;
            }

            const formattedContent = formatContent(content);

            const actionsHtml = role === 'assistant' ? `
                <div class="message-actions">
                    <button class="message-action-btn" onclick="copyMessage(this)">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        复制
                    </button>
                    <button class="message-action-btn" onclick="regenerateMessage()">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="23 4 23 10 17 10"></polyline>
                            <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path>
                        </svg>
                        重新生成
                    </button>
                </div>
            ` : '';

            messageDiv.innerHTML = `
                ${avatar}
                <div class="message-body">
                    <div class="message-content">${formattedContent}${sourcesHtml}</div>
                    ${actionsHtml}
                </div>
            `;

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Format Content
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function formatContent(content) {
            content = escapeHtml(content);
            return content
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/\n/g, '<br>')
                .replace(/- (.+?)(?=<br>|$)/g, '<li>$1</li>')
                .replace(/(\d+)\. (.+?)(?=<br>|$)/g, '<li>$2</li>');
        }

        // Show Loading
        function showLoading() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'loading-message';
            loadingDiv.id = 'loading-message';
            loadingDiv.innerHTML = `
                <div class="message-avatar">🎓</div>
                <div class="loading-content">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                    <span class="loading-text">正在思考...</span>
                </div>
            `;
            chatMessages.appendChild(loadingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        // Hide Loading
        function hideLoading() {
            const loadingEl = document.getElementById('loading-message');
            if (loadingEl) loadingEl.remove();
        }

        // Copy Message
        function copyMessage(btn) {
            const content = btn.closest('.message-body').querySelector('.message-content').innerText;
            navigator.clipboard.writeText(content).then(() => {
                showToast('已复制到剪贴板', 'success');
            });
        }

        // Regenerate Message
        function regenerateMessage() {
            const messages = document.querySelectorAll('.message.user');
            if (messages.length > 0) {
                const lastUserMessage = messages[messages.length - 1];
                const content = lastUserMessage.querySelector('.message-content').innerText;
                quickSend(content);
            }
        }

        // Chat History Management
        function loadChatHistory() {
            const saved = localStorage.getItem('chatHistory');
            if (saved) {
                chatHistory = JSON.parse(saved);
                renderChatHistory();
            }
        }

        function saveChatToHistory(userMessage, assistantMessage) {
            const chatItem = {
                id: Date.now(),
                title: userMessage.substring(0, 20) + (userMessage.length > 20 ? '...' : ''),
                userMessage,
                assistantMessage,
                timestamp: new Date().toISOString()
            };
            chatHistory.unshift(chatItem);
            if (chatHistory.length > 20) chatHistory.pop();
            localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
            renderChatHistory();
        }

        function renderChatHistory() {
            const historyHtml = chatHistory.map(item => `
                <div class="history-item" onclick="loadChat('${item.id}')">
                    <div class="history-item-icon">💬</div>
                    <div class="history-item-content">
                        <div class="history-item-title">${item.title}</div>
                        <div class="history-item-time">${formatTime(item.timestamp)}</div>
                    </div>
                    <button class="history-item-delete" onclick="deleteChat(event, '${item.id}')">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            `).join('');
            chatHistoryEl.innerHTML = '<div class="chat-history-title">历史记录</div>' + historyHtml;
        }

        function loadChat(id) {
            const chat = chatHistory.find(item => item.id === parseInt(id));
            if (chat) {
                // Clear current messages
                chatMessages.innerHTML = '';
                welcomeScreen.style.display = 'none';
                addMessage(chat.userMessage, 'user');
                addMessage(chat.assistantMessage, 'assistant');
            }
        }

        function deleteChat(event, id) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(item => item.id !== parseInt(id));
            localStorage.setItem('chatHistory', JSON.stringify(chatHistory));
            renderChatHistory();
            showToast('对话已删除', 'success');
        }

        function startNewChat() {
            sessionId = 'session_' + Date.now();
            chatMessages.innerHTML = '';
            welcomeScreen.style.display = 'flex';
            chatInput.value = '';
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;

            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            return date.toLocaleDateString();
        }

        // Toast Notifications
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    ${type === 'success'
                        ? '<polyline points="20 6 9 17 4 12"></polyline>'
                        : '<circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line>'
                    }
                </svg>
                <span>${message}</span>
            `;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        }
    </script>
