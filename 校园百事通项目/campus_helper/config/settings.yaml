# 应用配置
app:
  name: 校园百事通
  version: 1.1.0
  debug: true
  host: 0.0.0.0
  port: 8000

# 数据库配置
database:
  url: sqlite:///./data/campus_helper.db

# 向量数据库配置
vector_db:
  persist_dir: ./data/knowledge_base
  collection_name: campus_knowledge

# LLM配置
llm:
  # 当前使用的提供商: zhipu, openai, anthropic, local, deepseek
  provider: deepseek

  # 各提供商配置
  providers:
    deepseek:
      base_url: https://api.deepseek.com/v1
      model: deepseek-chat
      max_tokens: 1000
      temperature: 0.7
      timeout: 120.0
      api_key: ""

    zhipu:
      base_url: https://open.bigmodel.cn/api/paas/v4/
      model: glm-4.7-flash
      max_tokens: 1000
      temperature: 0.7
      timeout: 120.0
      api_key: ""

    openai:
      base_url: https://api.openai.com/v1
      model: gpt-3.5-turbo
      max_tokens: 1000
      temperature: 0.7
      api_key: ""

    anthropic:
      model: claude-3-sonnet-20240229
      max_tokens: 1000
      api_key: ""

    local:
      url: http://localhost:11434
      model: qwen:7b

# Embedding模型配置
embedding:
  model: BAAI/bge-large-zh-v1.5
  device: cpu
  cache_dir: ./models/embedding

# RAG配置
rag:
  top_k: 5
  similarity_threshold: 0.0
  chunk_size: 400
  chunk_overlap: 50

# BM25配置
bm25:
  k1: 1.5
  b: 0.75

# 安全配置
security:
  secret_key: ""
  token_expire_minutes: 60

# 日志配置
logging:
  level: INFO
  file: ./logs/campus_helper.log

# 缓存配置
cache:
  enabled: true
  max_size: 1000
  ttl_seconds: 3600
  similarity_threshold: 0.95
  stats_enabled: true
